services:
  db:
    image: postgres:16
    container_name: pinnaclepicks-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - pinnaclepicks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  pinnaclepicks:
    build: .
    container_name: pinnaclepicks
    ports:
      - "5000:5000"
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg://pinnaclepicks_user:${POSTGRES_PASSWORD}@db:5432/pinnaclepicks
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pinnaclepicks_postgres_data:
