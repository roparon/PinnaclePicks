[project]
name = "pinnaclepicks"
version = "1.0.0"
description = "PinnaclePicks sports analytics platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "python-dotenv==1.2.3",
    "psycopg[binary]",
]

[tool.vercel]
entrypoint = "run:app"
